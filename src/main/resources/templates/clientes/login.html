<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Cruz Market</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }
        .login-container .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .login-container label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .login-container .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        .login-container .btn-primary:hover {
            background-color: #0056b3;
        }
        /* 🆕 ESTILO AÑADIDO: Botón de Regresar */
        .login-container .btn-back {
            width: 100%;
            padding: 12px;
            background-color: #6c757d; /* Color gris */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px; /* Espacio entre Entrar y Regresar */
            transition: background-color 0.3s ease;
            color: #fff; /* Texto blanco */
        }
        .login-container .btn-back:hover {
            background-color: #5a6268;
        }
        /* 🆕 FIN ESTILO AÑADIDO */
        .login-container .error-message {
            color: #dc3545;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .login-container a {
            display: block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
        .login-container a:hover {
            text-decoration: underline;
        }

        /* 👁️ CSS AÑADIDO para el "ojo" 👁️ */
		.password-input-container {
		    position: relative;
		    display: flex;
		    align-items: center;
		}

		.password-input-container input {
		    width: 100%;
		    padding-right: 40px;
		}

		.toggle-password {
		    position: absolute;
		    right: 10px;
		    cursor: pointer;
		    user-select: none;
		    font-size: 1.2rem;
		    color: #555;
		    z-index: 10;
		}
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Iniciar Sesión en Cruz Market</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility('password', 'toggle-icon-login')">
                        <span id="toggle-icon-login">👁️</span>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>

            <button type="button" class="btn btn-back" onclick="window.location.href='/'">Regresar a la Tienda</button>
            <p id="errorMessage" class="error-message">Correo o contraseña incorrectos.</p>
			<a href="/clientes/recover">¿Olvidaste tu contraseña?</a>
            <a href="/clientes/register">¿No tienes una cuenta? Regístrate aquí</a>
        </form>
    </div>

    <script>
        // ------------------------------------------------
        // 👁️ FUNCIÓN JAVASCRIPT REUTILIZABLE PARA EL "OJO" 👁️
        // ------------------------------------------------
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }
        // ------------------------------------------------


		document.getElementById('loginForm').addEventListener('submit', function(event) {
		            event.preventDefault();

		            const email = document.getElementById('email').value;
		            const password = document.getElementById('password').value;
		            const errorMessage = document.getElementById('errorMessage');

		            // 1. Definimos la URL base relativa (esto evita el error de Mixed Content)
		            const baseUrl = '/api/v1/auth';
		            // 2. Construimos la URL completa para el login
		            const loginUrl = baseUrl + '/login';

		            fetch(loginUrl, {
		                method: 'POST',
		                headers: {
		                    'Content-Type': 'application/json'
		                },
		                body: JSON.stringify({ email, password })
		            })
		            .then(response => {
		                if (response.ok) {
		                    return response.json();
		                } else {
		                    errorMessage.textContent = 'Correo o contraseña incorrectos.';
		                    errorMessage.style.display = 'block';
		                    throw new Error('Credenciales inválidas');
		                }
		            })
		            .then(data => {
		                localStorage.setItem('token', data.token);
		                localStorage.setItem('userId', data.userId);
		                window.location.href = '/clientes/perfil';
		            })
		            .catch(error => {
		                if (errorMessage.style.display === 'none') {
		                    console.error('Error:', error);
		                    errorMessage.textContent = 'Ocurrió un error de conexión. Inténtalo de nuevo.';
		                    errorMessage.style.display = 'block';
		                }
		            });
		        });
    </script>
</body>
</html>
