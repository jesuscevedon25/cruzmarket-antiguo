<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Recuperar Contraseña - Cruz Market</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style>
		/* Reutilizando los estilos de tu archivo de login */
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			padding: 20px;
		}

		.login-container {
			background-color: #fff;
			padding: 40px;
			border-radius: 10px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 400px;
			text-align: center;
		}

		.login-container h2 {
			margin-bottom: 25px;
			color: #333;
			font-weight: 600;
		}

		.login-container .form-group {
			margin-bottom: 20px;
			text-align: left;
		}

		.login-container label {
			display: block;
			margin-bottom: 5px;
			color: #555;
			font-weight: 500;
		}

		.login-container input {
			width: 100%;
			padding: 12px;
			border: 1px solid #ddd;
			border-radius: 5px;
			box-sizing: border-box;
			font-size: 16px;
		}

		.login-container .btn-primary {
			width: 100%;
			padding: 12px;
			background-color: #007bff;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 18px;
			transition: background-color 0.3s ease;
		}

		.login-container .btn-primary:hover {
			background-color: #0056b3;
		}

		.message-box {
			margin-top: 15px;
			padding: 10px;
			border-radius: 5px;
			font-size: 14px;
			display: none;
		}

		.message-success {
			color: #155724;
			background-color: #d4edda;
			border: 1px solid #c3e6cb;
			display: block;
		}

		.message-error {
			color: #721c24;
			background-color: #f8d7da;
			border: 1px solid #f5c6cb;
			display: block;
		}

		.form-hidden {
			display: none;
		}

		.password-input-container {
			position: relative;
			display: flex;
			align-items: center;
		}

		.password-input-container input {
			width: 100%;
			padding-right: 40px;
		}

		.toggle-password {
			position: absolute;
			right: 10px;
			cursor: pointer;
			user-select: none;
			font-size: 1.2rem;
			color: #555;
			z-index: 10;
		}
	</style>
</head>

<body>
	<div class="login-container">
		<h2>Recuperar Contraseña</h2>

		<form id="emailForm">
			<p class="text-muted">Introduce tu correo electrónico para recibir un código de verificación.</p>
			<div class="form-group">
				<label for="email_recover">Correo Electrónico</label>
				<input type="email" id="email_recover" name="email" required>
			</div>
			<button type="submit" class="btn btn-primary">Recuperar Contraseña</button>
			<div id="emailMessage" class="message-box"></div>
		</form>

		<form id="codeForm" class="form-hidden">
			<p id="statusCorreo" class="text-center font-weight-bold text-primary">
				📨 Enviando código de verificación...
			</p>
			<div class="form-group">
				<label for="verificationCode">Ingresa el Código de 6 dígitos</label>
				<input type="text" id="verificationCode" name="code" required maxlength="6">
			</div>
			<button type="submit" class="btn btn-primary">Verificar Código</button>
			<p id="timerText" class="text-muted mt-3">Reenviar código en 60 s</p>
			<button type="button" id="btnResend" class="btn btn-link" style="display:none">Reenviar código</button>
			<div id="codeMessage" class="message-box"></div>
		</form>

		<form id="resetForm" class="form-hidden">
			<p class="text-muted">Introduce y confirma tu nueva contraseña.</p>
			<div class="form-group">
				<label for="newPassword">Nueva Contraseña</label>
				<div class="password-input-container">
					<input type="password" id="newPassword" name="newPassword" required>
					<span class="toggle-password" onclick="togglePasswordVisibility('newPassword', 'icon-new')">
						<span id="icon-new">👁️</span>
					</span>
				</div>
			</div>
			<div class="form-group">
				<label for="confirmPassword">Confirmar Contraseña</label>
				<div class="password-input-container">
					<input type="password" id="confirmPassword" name="confirmPassword" required>
					<span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', 'icon-confirm')">
						<span id="icon-confirm">👁️</span>
					</span>
				</div>
			</div>
			<button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
			<div id="resetMessage" class="message-box"></div>
		</form>

		<a href="/clientes/login">Volver al inicio de sesión</a>
	</div>

	<script>
		// ------------------------------------------------
		// 👁️ FUNCIÓN JAVASCRIPT PARA EL "OJO" 👁️
		// ------------------------------------------------
		function togglePasswordVisibility(inputId, iconId) {
			const passwordInput = document.getElementById(inputId);
			const toggleIcon = document.getElementById(iconId);

			if (passwordInput.type === 'password') {
				passwordInput.type = 'text';
				toggleIcon.textContent = '🔒';
			} else {
				passwordInput.type = 'password';
				toggleIcon.textContent = '👁️';
			}
		}
		// ------------------------------------------------

		// ------------------------------------------------
		// ⏱️ FUNCIÓN AÑADIDA PARA EL TEMPORIZADOR ⏱️
		// ------------------------------------------------
		function iniciarTemporizador() {
			const timerText = document.getElementById('timerText');
			const btnResend = document.getElementById('btnResend');
			let tiempo = 60;

			// Reiniciar visuales
			timerText.style.display = 'block';
			btnResend.style.display = 'none';
			timerText.textContent = `Reenviar código en ${tiempo} s`;

			const intervalo = setInterval(() => {
				tiempo--;
				timerText.textContent = `Reenviar código en ${tiempo} s`;

				if (tiempo <= 0) {
					clearInterval(intervalo);
					timerText.style.display = 'none';
					btnResend.style.display = 'inline-block'; // Muestra el botón para reenviar
				}
			}, 1000);
		}
		// ------------------------------------------------

		const emailForm = document.getElementById('emailForm');
		const codeForm = document.getElementById('codeForm');
		const resetForm = document.getElementById('resetForm');

		const emailMessage = document.getElementById('emailMessage');
		const codeMessage = document.getElementById('codeMessage');
		const resetMessage = document.getElementById('resetMessage');

		let userEmail = '';
		let verificationToken = '';

		const baseUrl = '/api/v1/auth';

		emailForm.addEventListener('submit', function (event) {
			event.preventDefault();
			emailMessage.style.display = 'none';

			userEmail = document.getElementById('email_recover').value;
			const url = `${baseUrl}/request-password-reset`;

			emailForm.classList.add('form-hidden');
			codeForm.classList.remove('form-hidden');

			codeMessage.className = 'message-box';
			codeMessage.style.display = 'block';
			codeMessage.textContent = '📨 Enviando código de verificación...';

			fetch(url, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({email: userEmail})
			})
				.then(response => {
					if (!response.ok) {
					    return response.text().then(error => {
					        throw new Error(error);
					    });
					}
					return response.text();
				})
				.then(() => {
					codeMessage.className = 'message-box message-success';
					codeMessage.textContent = '✅ Código enviado. Revisa tu correo electrónico.';
					codeMessage.style.display = 'block';

					iniciarTemporizador(); // ¡Ahora esta función sí existe!
				})
				.catch(error => {
					console.error(error);
					codeForm.classList.add("form-hidden");
					emailForm.classList.remove("form-hidden");

					emailMessage.className = "message-box message-error";
					emailMessage.textContent = "No fue posible enviar el correo. Inténtalo nuevamente.";
					emailMessage.style.display = "block";
				});
		});

		codeForm.addEventListener('submit', function (event) {
			event.preventDefault();
			codeMessage.style.display = 'none';

			const code = document.getElementById('verificationCode').value;
			const url = `${baseUrl}/verify-reset-code`;

			fetch(url, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({email: userEmail, code: code})
			})
				.then(response => {
					if (response.ok) {
						return response.text();
					} else {
						throw new Error('Código incorrecto o expirado.');
					}
				})
				.then(tokenString => {
					verificationToken = tokenString;

					codeMessage.className = 'message-box message-success';
					codeMessage.textContent = 'Código verificado correctamente.';
					codeMessage.style.display = 'block';

					codeForm.classList.add('form-hidden');
					resetForm.classList.remove('form-hidden');
				})
				.catch(error => {
					console.error('Error:', error);
					codeMessage.className = 'message-box message-error';
					codeMessage.textContent = 'Error: Código inválido o expirado. Intenta de nuevo.';
					codeMessage.style.display = 'block';
				});
		});

		resetForm.addEventListener('submit', function (event) {
			event.preventDefault();
			resetMessage.style.display = 'none';

			const newPassword = document.getElementById('newPassword').value;
			const confirmPassword = document.getElementById('confirmPassword').value;
			const url = `${baseUrl}/reset-password`;

			if (newPassword !== confirmPassword) {
				resetMessage.className = 'message-box message-error';
				resetMessage.textContent = 'Las contraseñas no coinciden.';
				resetMessage.style.display = 'block';
				return;
			}

			fetch(url, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({
					email: userEmail,
					token: verificationToken,
					newPassword: newPassword
				})
			})
				.then(response => {
					if (response.ok) {
						return response.text();
					} else {
						throw new Error('No se pudo cambiar la contraseña. Token inválido o expirado.');
					}
				})
				.then(() => {
					resetMessage.className = 'message-box message-success';
					resetMessage.textContent = '✅ ¡Contraseña cambiada con éxito! Redirigiendo...';
					resetMessage.style.display = 'block';

					setTimeout(() => {
						window.location.href = '/clientes/login';
					}, 2000);
				})
				.catch(error => {
					console.error('Error:', error);
					resetMessage.className = 'message-box message-error';
					resetMessage.textContent = 'Error al cambiar la contraseña. Token o datos inválidos.';
					resetMessage.style.display = 'block';
				});
		});

		// ------------------------------------------------
				// 🔄 EVENTO PARA EL BOTÓN DE REENVIAR CÓDIGO 🔄
				// ------------------------------------------------
				const btnResend = document.getElementById('btnResend');

				btnResend.addEventListener('click', function () {
					// 1. Cambiamos los mensajes visuales
					btnResend.style.display = 'none';
					codeMessage.className = 'message-box';
					codeMessage.textContent = '📨 Reenviando nuevo código de verificación...';
					codeMessage.style.display = 'block';

					// 2. Apuntamos a la misma ruta que usamos para solicitarlo la primera vez
					const url = `${baseUrl}/request-password-reset`;

					// 3. Volvemos a hacer la petición con el correo que ya tenemos guardado
					fetch(url, {
						method: 'POST',
						headers: {'Content-Type': 'application/json'},
						body: JSON.stringify({email: userEmail})
					})
						.then(response => {
							if (!response.ok) {
								return response.text().then(error => {
									throw new Error(error);
								});
							}
							return response.text();
						})
						.then(() => {
							// 4. Si sale bien, mostramos éxito y reiniciamos el reloj
							codeMessage.className = 'message-box message-success';
							codeMessage.textContent = '✅ Nuevo código enviado. Revisa tu correo electrónico.';
							iniciarTemporizador();
						})
						.catch(error => {
							// 5. Si falla, mostramos el error y devolvemos el botón
							console.error(error);
							codeMessage.className = 'message-box message-error';
							codeMessage.textContent = 'No fue posible reenviar el código. Inténtalo nuevamente.';
							btnResend.style.display = 'inline-block';
						});
				});
	</script>
</body>

</html>
