<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crear una Cuenta - Cruz Market</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style>
		/* ... (Estilos CSS sin cambios) ... */
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			padding: 20px;
		}

		.register-container {
			background-color: #fff;
			padding: 40px;
			border-radius: 10px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			width: 100%;
			max-width: 450px;
			text-align: center;
		}

		.register-container h2 {
			margin-bottom: 25px;
			color: #333;
			font-weight: 600;
		}

		.register-container .form-group {
			margin-bottom: 20px;
			text-align: left;
		}

		.register-container label {
			display: block;
			margin-bottom: 5px;
			color: #555;
			font-weight: 500;
		}

		.register-container input {
			width: 100%;
			padding: 12px;
			border: 1px solid #ddd;
			border-radius: 5px;
			box-sizing: border-box;
			font-size: 16px;
		}

		.register-container .btn-primary {
			width: 100%;
			padding: 12px;
			background-color: #28a745;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-size: 18px;
			transition: background-color 0.3s ease;
		}

		.register-container .btn-primary:hover {
			background-color: #218838;
		}

		.register-container a {
			display: block;
			margin-top: 15px;
			color: #007bff;
			text-decoration: none;
		}

		.register-container a:hover {
			text-decoration: underline;
		}

		.error-message {
			color: #dc3545;
			font-size: 14px;
			margin-top: 10px;
			display: none;
		}

		.validation-error {
			color: #dc3545;
			font-size: 12px;
			margin-top: 5px;
		}

		/* 💅 CSS AÑADIDO para el "ojo" 💅 */
		.password-input-container {
			position: relative;
			display: flex;
			align-items: center;
		}

		.password-input-container input {
			width: 100%;
			padding-right: 40px;
		}

		.toggle-password {
			position: absolute;
			right: 10px;
			cursor: pointer;
			user-select: none;
			font-size: 1.2rem;
			color: #555;
			z-index: 10;
			/* Asegura que el icono esté por encima del input */
		}
	</style>
</head>

<body>
	<div class="register-container">
		<h2>Crear una Cuenta</h2>
		<form id="registerForm">
			<div class="form-group">
				<label for="nombre">Nombre</label>
				<input type="text" id="nombre" name="nombre" required>
				<div id="nombre-error" class="validation-error"></div>
			</div>
			<div class="form-group">
				<label for="apellido">Apellido</label>
				<input type="text" id="apellido" name="apellido" required>
				<div id="apellido-error" class="validation-error"></div>
			</div>
			<div class="form-group">
				<label for="email">Correo Electrónico</label>
				<input type="email" id="email" name="email" required>
				<div id="email-error" class="validation-error"></div>
			</div>
			<div class="form-group">
				<label for="password">Contraseña</label>

				<div class="password-input-container">
					<input type="password" id="password" name="password" required>

					<span class="toggle-password" onclick="togglePasswordVisibility()">
						<span id="toggle-icon">👁️</span> </span>
				</div>

				<div id="password-error" class="validation-error"></div>
			</div>
			<button type="submit" class="btn btn-primary">Registrarse</button>
			<p id="server-error-message" class="error-message">Ocurrió un error. Inténtalo de nuevo.</p>
			<a href="/clientes/login">¿Ya tienes una cuenta? Inicia sesión aquí</a>
		</form>
	</div>

	<script>
		// ------------------------------------------------
		// 👁️ FUNCIÓN JAVASCRIPT AÑADIDA PARA EL "OJO" 👁️
		// ------------------------------------------------
		function togglePasswordVisibility() {
			const passwordInput = document.getElementById('password');
			const toggleIcon = document.getElementById('toggle-icon');

			if (passwordInput.type === 'password') {
				// Si está oculto, lo mostramos
				passwordInput.type = 'text';
				toggleIcon.textContent = '🔒'; // Cambiar a candado cerrado (símbolo de oculto)
			} else {
				// Si está visible, lo ocultamos
				passwordInput.type = 'password';
				toggleIcon.textContent = '👁️'; // Cambiar a ojo (símbolo de visible)
			}
		}
		// ------------------------------------------------

		document.getElementById('registerForm').addEventListener('submit', function (event) {
			event.preventDefault();

			const nombre = document.getElementById('nombre').value.trim();
			const apellido = document.getElementById('apellido').value.trim();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value; // No hacer trim a la contraseña
			const serverErrorMessage = document.getElementById('server-error-message');

			document.querySelectorAll('.validation-error').forEach(el => el.textContent = '');
			serverErrorMessage.style.display = 'none';

			let hasError = false;

			// 🛑 AÑADIDO: Validación de campos vacíos
			if (nombre === '') {
				document.getElementById('nombre-error').textContent = 'El nombre es obligatorio.';
				hasError = true;
			}
			if (apellido === '') {
				document.getElementById('apellido-error').textContent = 'El apellido es obligatorio.';
				hasError = true;
			}
			if (email === '') {
				document.getElementById('email-error').textContent = 'El correo electrónico es obligatorio.';
				hasError = true;
			}
			if (password === '') {
				document.getElementById('password-error').textContent = 'La contraseña es obligatoria.';
				hasError = true;
			}

			// Si hay un campo vacío, detenemos la ejecución aquí
			if (hasError) {
				return;
			}
			// ----------------------------------------------

			// Validación de formato (solo se ejecutan si los campos no están vacíos)

			const nombreRegex = /^[A-Za-zñÑáéíóúÁÉÍÓÚ\s]+$/;
			if (!nombreRegex.test(nombre)) {
				document.getElementById('nombre-error').textContent = 'El nombre no debe contener números.';
				hasError = true;
			}
			if (!nombreRegex.test(apellido)) {
				document.getElementById('apellido-error').textContent = 'El apellido no debe contener números.';
				hasError = true;
			}

			const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
			if (!emailRegex.test(email)) {
				document.getElementById('email-error').textContent = 'Ingresa un correo electrónico válido (ej. usuario@dominio.com).';
				hasError = true;
			}

			const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
			if (!passwordRegex.test(password)) {
				document.getElementById('password-error').textContent = 'La contraseña debe tener 8 caracteres, mayúscula, minúscula, número y símbolo.';
				hasError = true;
			}

			// ... (dentro del eventListener) ...

			if (hasError) {
				return;
			}

			// 1. URL corregida (añadimos /register al final)
			const registerUrl = '/api/v1/auth/register';

			fetch(registerUrl, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({nombre, apellido, email, password})
			})
				.then(response => {
					if (response.ok) {
						alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
						window.location.href = '/clientes/login';
					} else {
						return response.text().then(text => {
							throw new Error(text);
						});
					}
				})
				.catch(error => {
					console.error('Error:', error);
					serverErrorMessage.textContent = 'El registro falló: ' + error.message;
					serverErrorMessage.style.display = 'block';
				});
		});
	</script>
</body>

</html>
