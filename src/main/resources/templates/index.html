<!doctype html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
		crossorigin="anonymous">

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" th:href="@{/css/style.css}">

	<title>Bienvenidos a Cruz Market</title>

	<style>
		/* ... (Tus estilos CSS se mantienen sin cambios) ... */
		/* Hero / Banner principal */

		.hero {
			background-image: url("/images/imagen_portada.jpg");
			/* Mantén esta o cámbiala */
			height: 400px;
			/* Altura más reducida para un banner */
			background-size: cover;
			background-position: center;
			position: relative;
			color: white;
			display: flex;
			/* Para centrar contenido si es necesario */
			align-items: center;
			justify-content: center;
			/* AJUSTE PARA REDUCIR ESPACIO: Reducido de 20px a 10px */
			margin-bottom: 10px;
		}

		.hero::before {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.4);
			/* Oscurece un poco menos */
		}

		@media (min-width: 1200px) {
			.container {
				max-width: 80%;
			}
		}

		.hero-content {
			position: relative;
			z-index: 1;
			text-align: center;
		}

		.hero-content h1 {
			font-size: 3rem;
			/* Ajustar tamaño para banner */
			font-weight: bold;
			text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
			margin-bottom: 10px;
		}

		.hero-content p {
			font-size: 1.2rem;
			/* Ajustar tamaño */
		}

		/* Estilos para las secciones de contenido (Comics, Mangas, etc.) */

		.content-section {
			/* AJUSTE PARA REDUCIR ESPACIO: Reducido de 40px 0 a 20px 0 */
			padding: 20px 0;
		}

		.section-title {
			text-align: center;
			font-size: 2.5rem;
			font-weight: bold;
			/* AJUSTE PARA REDUCIR ESPACIO: Reducido de 40px a 20px */
			margin-bottom: 20px;
			color: #212121;
		}

		.section-title::after {
			content: '';
			display: block;
			width: 80px;
			height: 4px;
			background-color: rgb(0, 128, 255);
			/* Línea roja debajo del título */
			margin: 10px auto 0;
		}

		/* Estilos base de la tarjeta */
		.product-card {
			border: 1px solid #ddd;
			border-radius: 8px;
			overflow: hidden;
			text-align: center;
			padding: 15px;
			background-color: white;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			transition: transform 0.2s;

			/* Añadido para consistencia del carrusel */
			height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative; /* Necesario para posicionar el badge */
		}

		.product-card:hover {
			transform: translateY(-5px);
		}

		.product-card img {
			max-width: 100%;
			height: 150px; /* Nuevo: Altura fija para consistencia en el carrusel */
			object-fit: contain; /* Nuevo: Asegura que la imagen no se recorte */
			margin-bottom: 10px;
		}

		.product-card h5 {
			font-size: 1.2rem;
			color: #333;
			margin-bottom: 5px;
		}

		.product-card .price-old {
            color: #999;
            text-decoration: line-through;
            font-size: 0.9rem;
            font-weight: normal;
            display: block;
        }

		.product-card p {
			color: rgb(0, 128, 255);
			/* Precio en azul */
			font-weight: bold;
			font-size: 1.1rem;
			margin-bottom: 5px;
		}

		/* Estilos para el Carrusel */
		.carousel-control-prev, .carousel-control-next {
            width: 40px;
        }

        .carousel-control-prev-icon, .carousel-control-next-icon {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            padding: 10px;
            height: 40px;
            width: 40px;
        }

        .carousel-control-prev {
            left: -30px;
        }
        .carousel-control-next {
            right: -30px;
        }
	</style>

</head>

<body>

	<div th:replace="fragments/navbar :: navbars"></div>

	<div class="hero">

		<div class="hero-content">

			<h1>Bienvenidos a Cruz Market</h1>

			<p>Descubre los mejores productos y ofertas. ¡Compra ahora!</p>

		</div>

	</div>


	<div class="container content-section my-5" th:if="${ofertas != null and !ofertas.isEmpty()}">

        <h2 class="section-title text-center mb-4">¡OFERTAS IMPERDIBLES!</h2>

        <div id="ofertasCarousel" class="carousel slide" data-ride="carousel" data-interval="3000">

            <div class="carousel-inner">

                <th:block th:each="i : ${#numbers.sequence(0, ofertas.size() - 1, 4)}">

                    <div th:class="${i == 0} ? 'carousel-item active' : 'carousel-item'">

                        <div class="row justify-content-center">

                            <div class="col-md-3 mb-4"
                                 th:each="j : ${#numbers.sequence(i, T(java.lang.Math).min(i + 3, ofertas.size() - 1))}"
                                 th:with="producto=${ofertas.get(j)}">

                                <div class="product-card text-center shadow-sm">

                                    <span class="badge badge-danger"
                                          style="position: absolute; top: 10px; left: 10px;">OFERTA</span>

                                    <img th:src="${producto.imagenUrl}"
                                         th:alt="${producto.nombre}"
                                         class="img-fluid">

                                    <h5 class="mt-3" th:text="${producto.nombre}">Nombre Producto</h5>

                                    <p class="price-text" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</p>

                                    <a th:href="@{/productos/detalles/{id}(id=${producto.id})}" class="btn btn-danger btn-sm">Ver Detalles</a>

                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>

            </div>

            <a class="carousel-control-prev" href="#ofertasCarousel" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Anterior</span>
            </a>
            <a class="carousel-control-next" href="#ofertasCarousel" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Siguiente</span>
            </a>

        </div>
    </div>
	<div th:replace="~{fragments/footer :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" crossorigin="anonymous"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>

</body>

</html>
