<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Mis Favoritos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
		crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
	<div th:replace="fragments/navbar :: navbars"></div>
	<div class="container mt-5">
		<h1>Mis Favoritos</h1>

		<div class="d-flex justify-content-between align-items-center mb-4">
			<a th:href="@{/}" class="btn btn-secondary">Regresar</a>
		</div>

		<div class="row">
			<div class="col-md-3 mb-4" th:each="favorito:${favoritos}">
				<div class="card product-card">

					<button type="button" class="close position-absolute" style="top: 5px; right: 10px;"
						th:attr="data-id=${favorito.id}" onclick="eliminarFavorito(this)">
						<span aria-hidden="true">&times;</span>
					</button>

					<img th:src="${favorito.producto.imagenUrl}" class="card-img-top"
						th:alt="${favorito.producto.nombre}">
					<div class="card-body">
						<h5 class="card-title" th:text="${favorito.producto.nombre}">Nombre del Producto</h5>

						<div th:if="${favorito.producto.precioOferta != null}" class="d-flex align-items-center">
							<p class="card-text mb-0">
								<span th:text="'S/ ' + ${#numbers.formatDecimal(favorito.producto.precio, 1, 2)}"
									style="text-decoration: line-through; color: #888; margin-right: 5px;">S/
									0.00</span>
							</p>
							<p class="card-text mb-0"
								th:text="'S/ ' + ${#numbers.formatDecimal(favorito.producto.precioOferta, 1, 2)}"
								style="font-weight: bold; color: rgb(0, 128, 255);">S/ 0.00</p>
							<span class="badge badge-danger ml-2"
								th:text="${T(java.lang.Math).round((1 - favorito.producto.precioOferta / favorito.producto.precio) * 100)} + '% OFF'">%
								OFF</span>
						</div>

						<div th:unless="${favorito.producto.precioOferta != null}">
							<p class="card-text"
								th:text="'S/ ' + ${#numbers.formatDecimal(favorito.producto.precio, 1, 2)}"
								style="font-weight: bold; color: rgb(0, 128, 255);">S/ 0.00</p>
						</div>

						<a th:href="@{/productos/detalles/{id}(id=${favorito.producto.id})}"
							class="btn btn-danger btn-sm mt-3">Ver
							Detalles</a>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// 1. VALIDACIÓN DE SESIÓN AL CARGAR LA PÁGINA
		// Esta parte es crucial para que la página de favoritos no se muestre si no hay una sesión activa.
		// Redirige al usuario al login si no encuentra el token.
		window.onload = function () {
			const token = localStorage.getItem('token');
			const userId = localStorage.getItem('userId');

			if (!token || !userId) {
				window.location.replace('/clientes/login');
			}
		};

		// ---

		// 2. FUNCIONES
		// Aquí se definen las funciones que se pueden llamar desde el HTML.
		function eliminarFavorito(button) {
			const favoritoId = button.getAttribute("data-id");

			if (confirm("¿Seguro que deseas eliminar este favorito?")) {
				fetch(`/favoritos/${favoritoId}`, {
					method: "DELETE"
				})
					.then(response => {
						if (response.ok) {
							// eliminar la tarjeta del DOM sin recargar
							button.closest(".col-md-3").remove();
						} else {
							alert("Error al eliminar el favorito");
						}
					})
					.catch(error => console.error("Error:", error));
			}
		}

		// ---

		// 3. EVENT LISTENERS
		// Aquí se añaden los escuchadores de eventos a los botones.
		// Aunque el botón de "Cerrar Sesión" está en otra página (perfil.html),
		// si lo incluyes en tu navbar, este código funcionará aquí también.
		document.getElementById('logoutBtn').addEventListener('click', () => {
			// Vacía la lista de favoritos en el front-end
			const favoritosContainer = document.querySelector('.container .row');
			if (favoritosContainer) {
				favoritosContainer.innerHTML = '';
			}

			// Elimina la información del usuario del navegador
			localStorage.removeItem('token');
			localStorage.removeItem('userId');

			// Redirige al usuario de forma segura
			window.location.replace('/clientes/login');
		});

	</script>


	<div th:replace="~{fragments/footer :: footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
</body>

</html>
